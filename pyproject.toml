[project]
name = "atlas"
version = "0.1.0"
description = "Agentic Research, Knowledge Retrieval and Decision Intelligence Platform"
readme = "README.md"
authors = [{ name = "Atlas" }]
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
keywords = [
    "langgraph",
    "langchain",
    "rag",
    "agents",
    "research",
    "decision-intelligence",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "langchain>=0.3.14",
    "langchain-core>=0.3.29",
    "langchain-openai>=0.3.0",
    "langchain-anthropic>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-community>=0.3.14",
    "langchain-text-splitters>=0.3.4",
    "langgraph>=0.2.60",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langsmith>=0.2.0",
    "tiktoken>=0.8.0",
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",
    "markdownify>=0.14.1",
    "bleach>=6.2.0",
    "python-multipart>=0.0.18",
    "sse-starlette>=2.1.3",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "numpy>=2.1.0",
    "rank-bm25>=0.2.2",
    "streamlit>=1.41.0",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-bleach>=6.2.0",
    "types-redis>=4.6.0",
    "httpx>=0.28.0",
    "testcontainers[postgres,redis]>=4.8.0",
]

[project.scripts]
atlas-api = "atlas.apps.api.main:run"
atlas-worker = "atlas.apps.worker.main:run"
atlas-ingest = "atlas.cli.ingest:main"
atlas-eval = "atlas.cli.evaluate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas"]

[tool.uv]
package = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "apps"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ASYNC", "RUF"]
ignore = ["B008", "RUF012", "E501", "ASYNC110"]

[tool.ruff.lint.isort]
known-first-party = ["atlas"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
mypy_path = "src"
packages = ["atlas"]
exclude = ["alembic", "apps/ui"]

[[tool.mypy.overrides]]
module = [
    "pgvector.*",
    "langgraph.*",
    "langgraph_checkpoint_postgres.*",
    "langchain.*",
    "langchain_core.*",
    "langchain_openai.*",
    "langchain_anthropic.*",
    "langchain_google_genai.*",
    "langchain_ollama.*",
    "langchain_community.*",
    "langchain_text_splitters.*",
    "langsmith.*",
    "rank_bm25.*",
    "bs4.*",
    "docx.*",
    "markdownify.*",
    "sse_starlette.*",
    "prometheus_client.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: fast isolated tests",
    "integration: tests requiring postgres/redis",
    "evaluation: research quality evaluations",
    "graph: LangGraph workflow tests",
]

[tool.coverage.run]
source = ["src/atlas"]
omit = ["src/atlas/apps/ui/*"]

[tool.coverage.report]
fail_under = 0
show_missing = true
