services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: atlas
      POSTGRES_PASSWORD: atlas
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - atlas_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atlas"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - .env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://atlas:atlas@postgres:5432/atlas
      DATABASE_URL_SYNC: postgresql+psycopg://atlas:atlas@postgres:5432/atlas
      REDIS_URL: redis://redis:6379/0
      MODEL_PROVIDER: demo
      EMBEDDING_PROVIDER: demo
      ATLAS_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  ui:
    build:
      context: .
      dockerfile: docker/Dockerfile
    command: ["streamlit", "run", "src/atlas/apps/ui/app.py", "--server.port=8501", "--server.address=0.0.0.0"]
    environment:
      ATLAS_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api

volumes:
  atlas_pg:
