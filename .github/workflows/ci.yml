name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check src tests apps
      - name: Tests
        env:
          ATLAS_ENV: test
          MODEL_PROVIDER: demo
          EMBEDDING_PROVIDER: demo
        run: uv run pytest -q
      - name: Mypy
        run: uv run mypy src
        continue-on-error: true
